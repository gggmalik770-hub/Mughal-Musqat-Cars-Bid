name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project
        run: |
          mkdir -p build_project
          unzip -q MughalMuscatCarBid_Complete_Android_Project.zip -d build_project
          echo "Project files:"
          find build_project -maxdepth 3 -type f | head -100

      - name: Find Android project
        run: |
          PROJECT_DIR=$(find build_project \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit | xargs dirname)
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Fix Kotlin duplicate dependencies
        run: |
          cat > "$RUNNER_TEMP/force-kotlin.gradle" <<'EOF'
          allprojects {
            configurations.all {
              resolutionStrategy.eachDependency { details ->
                if (details.requested.group == "org.jetbrains.kotlin") {
                  details.useVersion "1.8.22"
                }
              }
            }
          }
          EOF

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew --init-script "$RUNNER_TEMP/force-kotlin.gradle" assembleDebug
          else
            gradle --init-script "$RUNNER_TEMP/force-kotlin.gradle" assembleDebug
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mughal-Muscat-Car-Bid-APK
          path: "**/build/outputs/apk/debug/*.apk"

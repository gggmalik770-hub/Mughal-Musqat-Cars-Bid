<script>
const firebaseConfig={
 apiKey:"AIzaSyDeVmpfmEa_WN4i0g2EpkYicS20A9VBiNU",
 authDomain:"mughal-muscst-car-bid.firebaseapp.com",
 projectId:"mughal-muscst-car-bid",
 storageBucket:"mughal-muscst-car-bid.firebasestorage.app",
 messagingSenderId:"248054757967",
 appId:"1:248054757967:web:edcd72427e0717b7e4083a",
 measurementId:"G-1VHMTKX32L"
};

firebase.initializeApp(firebaseConfig);

const auth=firebase.auth();
const db=firebase.firestore();

let me=null;
let page="home";
let ads=[];
let unsubscribeAds=null;

function esc(s){
 return String(s==null?"":s).replace(/[&<>"']/g,m=>({
  "&":"&amp;",
  "<":"&lt;",
  ">":"&gt;",
  '"':"&quot;",
  "'":"&#39;"
 }[m]));
}

let phoneConfirmation=null;
let phoneRecaptcha=null;

function showLogin(message=""){
 document.getElementById("root").innerHTML=`
 <div class="login">
  <div class="loginbox">
   <div class="logoBig">OPEN MUSCAT<br><span style="color:#d4af37">CAR BID</span><small style="display:block;font-size:14px;margin-top:8px;color:#f3d675;direction:rtl">أوبن مسقط كار بيد</small></div>
   <p class="muted">Buy &#x2022; Sell &#x2022; Bid &#x2022; Deliver</p>
   <input class="field" id="email" type="email" placeholder="Email">
   <input class="field" id="pass" type="password" placeholder="Password">
   <button type="button" class="btn" style="width:100%" onclick="login()">Login with Email</button>
   <hr>
   <p class="muted">Or login with your Oman mobile number</p>
   <div class="phone-row">
    <input class="field code" id="phoneCode" value="+968" inputmode="tel" aria-label="Country code">
    <input class="field number" id="phoneNumber" type="tel" inputmode="numeric" placeholder="Oman mobile number">
   </div>
   <div id="recaptcha-container"></div>
   <button type="button" class="btn alt" style="width:100%" onclick="sendPhoneCode()">Send OTP</button>
   <div id="otpBox" style="display:none">
    <input class="field" id="phoneOtp" inputmode="numeric" placeholder="Enter SMS OTP">
    <button type="button" class="btn" style="width:100%" onclick="verifyPhoneCode()">Verify OTP</button>
   </div>
   <p id="err" class="danger">${esc(message)}</p>
   <hr>
   <p class="muted">New user?</p>
   <button type="button" class="btn alt" onclick="showRegister()">Create account</button>
  </div>
 </div>`;
}

function showRegister(){
 document.getElementById("root").innerHTML=`
 <div class="login">
  <div class="loginbox">
   <div class="logoBig">Create Account</div>
   <p class="muted">Your account will be sent to admin for approval.</p>
   <input class="field" id="rname" placeholder="Full name">
   <input class="field" id="remail" type="email" placeholder="Email">
   <input class="field" id="rpass" type="password" placeholder="Password (6+ characters)">
   <button class="btn" style="width:100%" onclick="register()">Submit for approval</button>
   <button class="field" onclick="showLogin()">Back to login</button>
   <p id="rerr" class="danger"></p>
  </div>
 </div>`;
}

async function register(){
 const name=document.getElementById("rname").value.trim();
 const email=document.getElementById("remail").value.trim();
 const phone=(document.getElementById("rphone")?.value||"").trim();
 const pass=document.getElementById("rpass").value;
 const err=document.getElementById("rerr");

 if(!name || !email || !pass){err.textContent="Please fill all fields.";return;}
 if(pass.length<6){err.textContent="Password must be at least 6 characters.";return;}

 try{
  const cred=await auth.createUserWithEmailAndPassword(email,pass);
  await db.collection("users").doc(cred.user.uid).set({
   name:name,email:email,phone:phone,role:"user",status:"pending",
   createdAt:firebase.firestore.FieldValue.serverTimestamp()
  });
  await auth.signOut();
  showLogin("Account created. Waiting for admin approval.");
 }catch(e){
  console.error(e);
  err.textContent=e.message||"Registration failed.";
 }
}

function normalizeOmanPhone(){
 let code=(document.getElementById("phoneCode")?.value||"+968").replace(/\s+/g,"");
 let n=(document.getElementById("phoneNumber")?.value||"").replace(/[^0-9]/g,"");
 if(n.startsWith("968")) n=n.slice(3);
 if(n.startsWith("0")) n=n.slice(1);
 if(code!=="+968") code="+968";
 if(!/^[0-9]{8}$/.test(n)) return null;
 return code+n;
}

function setupPhoneRecaptcha(){
 if(phoneRecaptcha) return phoneRecaptcha;
 phoneRecaptcha=new firebase.auth.RecaptchaVerifier("recaptcha-container",{size:"normal"});
 return phoneRecaptcha;
}

async function sendPhoneCode(){
 const err=document.getElementById("err");
 err.textContent="";
 const phone=normalizeOmanPhone();
 if(!phone){err.textContent="Enter an 8-digit Oman mobile number, e.g. 77009264.";return;}
 try{
  const verifier=setupPhoneRecaptcha();
  phoneConfirmation=await auth.signInWithPhoneNumber(phone,verifier);
  document.getElementById("otpBox").style.display="block";
  err.textContent="OTP sent by SMS.";
 }catch(e){
  console.error(e);
  if(phoneRecaptcha){try{phoneRecaptcha.clear();}catch(_){} phoneRecaptcha=null;}
  err.textContent=e.message||"Could not send OTP.";
 }
}

async function verifyPhoneCode(){
 const err=document.getElementById("err");
 const otp=(document.getElementById("phoneOtp")?.value||"").trim();
 if(!phoneConfirmation){err.textContent="Please request an OTP first.";return;}
 if(!/^\d{6}$/.test(otp)){err.textContent="Enter the 6-digit OTP.";return;}
 try{
  const cred=await phoneConfirmation.confirm(otp);
  const existing=await getUserProfile(cred.user.uid);
  if(!existing){
   await db.collection("users").doc(cred.user.uid).set({phone:cred.user.phoneNumber,name:"",role:"user",status:"pending",createdAt:firebase.firestore.FieldValue.serverTimestamp()});
   await auth.signOut();
   showLogin("Mobile verified. Your account is waiting for admin approval.");
   return;
  }
  const status=String(existing.status||"").toLowerCase();
  if(existing.role!=="admin"&&status!=="approved"){
   await auth.signOut();
   showLogin("Your account is waiting for admin approval.");
   return;
  }
  me=existing;
  page="home";
  listenAds();
  render();
 }catch(e){
  console.error(e);
  err.textContent=e.message||"Invalid OTP.";
 }
}

async function getUserProfile(uid){
 let snap=await db.collection("users").doc(uid).get();
 if(snap.exists){return {uid:uid,...snap.data()};}
 snap=await db.collection("User").doc(uid).get();
 if(snap.exists){return {uid:uid,...snap.data()};}
 return null;
}

async function login(){
 const email=document.getElementById("email").value.trim();
 const pass=document.getElementById("pass").value;
 const err=document.getElementById("err");
 err.textContent="";

 if(!email || !pass){err.textContent="Enter email and password.";return;}

 try{
  const cred=await auth.signInWithEmailAndPassword(email,pass);
  const profile=await getUserProfile(cred.user.uid);

  if(!profile){
   await auth.signOut();
   err.textContent="Account profile not found in Firestore.";
   return;
  }

  const status=String(profile.status||"").toLowerCase();

  if(profile.role!=="admin" && status!=="approved"){
   await auth.signOut();
   err.textContent="Your account is waiting for admin approval.";
   return;
  }

  me=profile;
  page="home";
  listenAds();
  render();
 }catch(e){
  console.error(e);
  err.textContent=e.message||"Login failed.";
 }
}

function listenAds(){
 if(unsubscribeAds){unsubscribeAds();}
 unsubscribeAds=db.collection("ads").onSnapshot(
  snapshot=>{
   ads=[];
   snapshot.forEach(doc=>{
    const a={id:doc.id,...doc.data()};
    if(String(a.status||"active").toLowerCase()==="active") ads.push(a);
   });
   ads.sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0));
   if(me){render();}
  },
  error=>{
   console.error("Ads listener:",error);
   const c=document.getElementById("content");
   if(c && me) c.innerHTML=home()+`<section><p class="danger">Ads could not be refreshed. Please refresh the page.</p></section>`;
  }
 );
}

function render(){
 document.getElementById("root").innerHTML=`
 <div class="app page">
  <header>
   <div class="brand">
    <div class="brand-mark">&#x2655;</div>
    <div>
     <div class="logo">OPEN MUSCAT CAR BID</div><div class="sub" style="direction:rtl">أوبن مسقط كار بيد • سوق السيارات والمزادات في عمان</div>
     <div class="sub">Oman Marketplace &#x2022; Buy &#x2022; Sell &#x2022; Bid</div>
    </div>
   </div>
  </header>
  <div id="content"></div>
  <div class="nav">
   <button onclick="go('home')">&#x2302;<br>Home</button>
   <button onclick="go('cars')">&#x1F50E;<br>Browse</button>
   <button onclick="go('post')">&#xFF0B;<br>Post Ad</button>
   <button onclick="go('profile')">&#x2659;<br>Profile</button>
  </div>
 </div>`;
 go(page);
}

 page=p;
 const c=document.getElementById("content");
 if(!c)return;
 if(p==="home")c.innerHTML=home();
 else if(p==="cars")c.innerHTML=cars();
 else if(p==="post")c.innerHTML=post();
 else if(p==="profile")c.innerHTML=profile();
 else if(p==="admin")admin();
 else if(p==="myads")myAds();
}

 return `

  <div class="row"><input class="field" id="homeSearch" style="margin:0;flex:1" placeholder="Search cars, mobiles, homes..." oninput="renderHomeSearch()"><button class="btn alt" onclick="go('cars')">Browse</button></div>

 </section>
 <section><div class="list" style="text-align:center"><b>Get the Open Muscat Car Bid App</b><br><small style="direction:rtl">حمّل تطبيق أوبن مسقط كار بيد</small><br><small>Download the Android app directly to your phone.</small><br><a class="btn" style="display:inline-block;text-decoration:none;margin-top:8px" href="./app-release.apk" download>&#x2B07;&#xFE0F; Download APK</a></div></section>`;
}

function renderHomeSearch(){

 const box=document.getElementById('homeCards'); if(!box)return;
 const arr=ads.filter(a=>!q||[a.title,a.description,a.city,a.category].some(v=>String(v||'').toLowerCase().includes(q))).slice(0,6);
 box.innerHTML=arr.map(card).join('')||'<p class="muted">No matching listings.</p>';
}

}

  <input class="field" id="searchBox" placeholder="Search anything..." oninput="renderListings()">

function renderListings(){
 const box=document.getElementById('listingBox'); if(!box)return;
 const q=(document.getElementById('searchBox')?.value||'').toLowerCase().trim();
 const cat=document.getElementById('categoryFilter')?.value||'';
 const arr=ads.filter(a=>{const hay=[a.title,a.description,a.city,a.category].map(v=>String(v||'').toLowerCase()).join(' ');return (!q||hay.includes(q))&&(!cat||String(a.category||'Cars')===cat);});
 box.innerHTML=arr.length?arr.map(a=>`<div class="list" onclick="detail('${esc(a.id)}')"><div class="row"><div style="width:90px;font-size:40px">${a.images&&a.images.length?`<img src="${a.images[0]}" style="width:90px;height:70px;object-fit:cover;border-radius:8px" alt="">`:"&#x1F4E6;"}</div><div><span class="pill">${esc(a.category||'Cars')}</span><br><b>${esc(a.title)}</b><div class="price">OMR ${Number(a.price||0).toLocaleString()}</div><small>&#x1F4CD; ${esc(a.city||'Muscat')}</small></div></div></div>`).join(''):'<p class="muted">No listings found.</p>';
}

function post(){
 return `
 <section>
  <div class="title"><h3>Post an Ad</h3></div>
  <select class="field" id="adCategory"><option value="">Choose category</option><option>Cars</option><option>Mobiles</option><option>Property</option><option>Bikes</option><option>Electronics</option><option>Furniture</option><option>Jobs</option><option>Other</option></select>
  <input class="field" id="adTitle" placeholder="Title e.g. Toyota Camry / iPhone / House for Sale">
  <input class="field" id="adPrice" type="number" placeholder="Price OMR">
  <input class="field" id="adCity" placeholder="City / Area e.g. Muscat, Al Khoudh">
  <input class="field" id="adPhone" type="tel" placeholder="Mobile number e.g. +968XXXXXXXX" value="${esc(me?.phone||'')}">
  <textarea class="field" id="adDesc" rows="5" placeholder="Description and details"></textarea>
  <input class="field" id="adImages" type="file" accept="image/*" multiple onchange="previewImages(event)">
  <div id="preview" class="gallery"></div>
  <button type="button" class="btn" style="width:100%" onclick="createAd(event)">Post Ad</button>
  <p id="postErr" class="danger"></p>
 </section>`;
}

let selectedImages=[];

function imageToSmallDataUrl(file,maxSide=900,quality=.58){
 return new Promise((resolve,reject)=>{
  const reader=new FileReader();
  reader.onload=e=>{
   const img=new Image();
   img.onload=()=>{
    const scale=Math.min(1,maxSide/Math.max(img.width,img.height));
    const canvas=document.createElement("canvas");
    canvas.width=Math.max(1,Math.round(img.width*scale));
    canvas.height=Math.max(1,Math.round(img.height*scale));
    const ctx=canvas.getContext("2d");
    ctx.drawImage(img,0,0,canvas.width,canvas.height);
    resolve(canvas.toDataURL("image/jpeg",quality));
   };
   img.onerror=reject;
   img.src=e.target.result;
  };
  reader.onerror=reject;
  reader.readAsDataURL(file);
 });
}

async function previewImages(event){
 selectedImages=[];
 const files=[...event.target.files].slice(0,3);
 const preview=document.getElementById("preview");
 if(!preview)return;
 preview.innerHTML="";
 for(const file of files){
  try{
   const data=await imageToSmallDataUrl(file);
   selectedImages.push(data);
   const img=document.createElement("img");
   img.src=data;
   preview.appendChild(img);
  }catch(e){console.error(e);}
 }
}

async function createAd(event){
 if(event){event.preventDefault();event.stopPropagation();}
 const category=document.getElementById("adCategory").value.trim();
 const title=document.getElementById("adTitle").value.trim();
 const price=Number(document.getElementById("adPrice").value);
 const city=document.getElementById("adCity").value.trim();
 const phone=(document.getElementById("adPhone")?.value||me.phone||"").trim();
 const desc=document.getElementById("adDesc").value.trim();
 const err=document.getElementById("postErr");
 err.textContent="";
 if(!category||!title||!price||!city||!phone){err.textContent="Please choose a category and enter title, price, location and mobile number.";return false;}
 if(!me){err.textContent="Please login first.";return false;}
 if(me.role!=="admin"&&String(me.status).toLowerCase()!=="approved"){err.textContent="Your account is not approved yet.";return false;}
 try{
  const docData={category,title,price,city,description:desc,images:selectedImages.slice(0,3),ownerId:me.uid,ownerName:me.name||me.email||me.phone||"Seller",ownerPhone:phone,status:"active",createdAt:firebase.firestore.FieldValue.serverTimestamp()};
  const ref=await db.collection("ads").add(docData);
  selectedImages=[];
  alert("Ad posted successfully.");
  page="cars";
  go("cars");
  setTimeout(renderListings,100);
  return ref.id;
 }catch(e){
  console.error("createAd:",e);
  err.textContent=e.message||"Could not post ad.";
  return false;
 }
}
async function detail(id){
 const a=ads.find(x=>x.id===id);
 if(!a)return;
 page="detail";
 const c=document.getElementById("content");
 if(!c)return;
 let sellerPhone=a.ownerPhone||"";
 if(a.ownerId){
  try{const u=await getUserProfile(a.ownerId); if(u&&u.phone)sellerPhone=u.phone;}catch(e){console.warn(e);}
 }
 const safePhone=String(sellerPhone||"").replace(/[^0-9+]/g,"");
 c.innerHTML=`
 <section>
  <button class="btn" onclick="go('cars')">&#x2190; Back</button>
  <h2>${esc(a.title)}</h2>
  <div class="gallery">${a.images&&a.images.length?a.images.map(x=>`<img src="${esc(x)}">`).join(""):""}</div>
  <div class="price">OMR ${Number(a.price||0).toLocaleString()}</div>
  <p>&#x1F4CD; ${esc(a.city||"Muscat")}</p>
  <p>${esc(a.description||"No description")}</p>
  <div class="list"><b>Seller</b><br>${esc(a.ownerName||"Seller")}<br>${safePhone?`<b>Mobile:</b> ${esc(sellerPhone)}`:"<span class=\"muted\">Seller mobile not added yet.</span>"}</div>
  ${safePhone?`<div class="row" style="gap:8px;margin-top:10px"><a class="btn" style="flex:1;text-align:center;text-decoration:none" href="tel:${esc(safePhone)}">&#x1F4DE; Call</a><a class="btn alt" style="flex:1;text-align:center;text-decoration:none" href="sms:${esc(safePhone)}">&#x1F4AC; SMS</a></div>`:""}
  <button class="btn" style="width:100%;margin-top:10px" onclick="placeBid('${esc(a.id)}')">Place Bid</button>
 </section>`;
}

async function placeBid(adId){
 if(!me){alert("Please login first.");return;}
 const amount=prompt("Enter your bid amount in OMR:");
 if(!amount)return;
 const bid=Number(amount);
 if(!bid||bid<=0){alert("Enter a valid amount.");return;}
 try{
  await db.collection("ads").doc(adId).collection("bids").add({
   userId:me.uid,userName:me.name||me.email,amount:bid,
   createdAt:firebase.firestore.FieldValue.serverTimestamp()
  });
  alert("Bid placed successfully.");
 }catch(e){
  console.error(e);
  alert(e.message||"Bid failed.");
 }
}

async function saveMyPhone(){
 const input=document.getElementById("myPhone");
 const phone=(input?.value||"").trim();
 try{
  await db.collection("users").doc(me.uid).set({phone:phone},{merge:true});
  me.phone=phone;
  alert("Mobile number saved.");
 }catch(e){alert(e.message||"Could not save mobile number.");}
}

function profile(){
 return `
 <section>
  <div class="title"><h3>Profile</h3></div>
  <div class="list">
   <b>${esc(me.name||"User")}</b><br>${esc(me.email||"")}<br><br>
   <label>Mobile number for buyers</label>
   <input class="field" id="myPhone" type="tel" value="${esc(me.phone||"")}" placeholder="e.g. +968XXXXXXXX">
   <button class="btn alt" style="width:100%" onclick="saveMyPhone()">Save Mobile Number</button><br><br>
   <span class="pill">${esc(me.role||"user")}</span>
  </div>
  <button class="btn" style="width:100%" onclick="go('myads')">My Ads &amp; Bids</button>
  ${me.role==="admin"?`<button class="btn" style="width:100%" onclick="go('admin')">Admin Panel</button>`:""}
  <button class="btn red" style="width:100%" onclick="logout()">Logout</button>
 </section>`;
}

async function myAds(){
 const c=document.getElementById("content");
 c.innerHTML=`<section><h3>My Ads &amp; Bids</h3><div class="loading">Loading...</div></section>`;
 try{
  const snap=await db.collection("ads").where("ownerId","==",me.uid).get();
  let list="";
  for(const doc of snap.docs){
   const a={id:doc.id,...doc.data()};
   const bids=await db.collection("ads").doc(a.id).collection("bids").orderBy("createdAt","desc").get();
   let bidsHtml="<p class=\"muted\">No bids yet.</p>";
   if(!bids.empty){
    bidsHtml=bids.docs.map(b=>{const x=b.data();return `<div class="list" style="margin-top:8px"><b>Bid: OMR ${Number(x.amount||0).toLocaleString()}</b><br><small>Bidder: ${esc(x.userName||"User")}</small></div>`;}).join("");
   }
   list+=`<div class="list"><b>${esc(a.title)}</b><div class="price">OMR ${Number(a.price||0).toLocaleString()}</div><small>${esc(a.city||"Muscat")}</small><h4 style="margin-bottom:6px">Bids (${bids.size})</h4>${bidsHtml}</div>`;
  }
  c.innerHTML=`<section><h3>My Ads &amp; Bids</h3>${list||'<p class="muted">You have no ads yet.</p>'}<button class="btn" onclick="go('profile')">Back</button></section>`;
 }catch(e){
  console.error(e);
  c.innerHTML=`<section><p class="danger">${esc(e.message||"Could not load ads and bids.")}</p><button class="btn" onclick="go('profile')">Back</button></section>`;
 }
}

function admin(){
 const c=document.getElementById("content");
 if(!c)return;
 if(me.role!=="admin"){
  c.innerHTML=`<section><p class="danger">Admin access only.</p><button class="btn" onclick="go('profile')">Back</button></section>`;
  return;
 }
 c.innerHTML=`<section><div class="title"><h3>Admin Panel</h3></div><div id="adminUsers"><div class="loading">Loading users...</div></div></section>`;
 loadUsers();
}

async function loadUsers(){
 const box=document.getElementById("adminUsers");
 if(!box)return;
 try{
  const snap=await db.collection("users").get();
  let html="";
  snap.forEach(doc=>{
   const u={uid:doc.id,...doc.data()};
   html+=`
   <div class="list">
    <b>${esc(u.name||"User")}</b><br>
    <small>${esc(u.email||"")}</small><br><br>
    <span class="pill">${esc(u.status||"pending")}</span>
    <span class="pill">${esc(u.role||"user")}</span><br><br>
    ${u.role!=="admin"&&String(u.status).toLowerCase()!=="approved"?`<button class="btn" onclick="approveUser('${esc(u.uid)}')">Approve</button>`:""}
    ${u.role!=="admin"&&String(u.status).toLowerCase()==="approved"?`<button class="btn red" onclick="blockUser('${esc(u.uid)}')">Block</button>`:""}
   </div>`;
  });
  box.innerHTML=html||'<p class="muted">No users found.</p>';
 }catch(e){
  console.error(e);
  box.innerHTML=`<p class="danger">${esc(e.message||"Could not load users.")}</p>`;
 }
}

async function approveUser(uid){
 if(me.role!=="admin")return;
 try{
  await db.collection("users").doc(uid).update({status:"approved"});
  alert("User approved.");
  loadUsers();
 }catch(e){console.error(e);alert(e.message||"Approval failed.");}
}

async function blockUser(uid){
 if(me.role!=="admin")return;
 if(!confirm("Block this user?"))return;
 try{
  await db.collection("users").doc(uid).update({status:"blocked"});
  alert("User blocked.");
  loadUsers();
 }catch(e){console.error(e);alert(e.message||"Could not block user.");}
}

async function logout(){
 try{
  if(unsubscribeAds){unsubscribeAds();unsubscribeAds=null;}
  me=null;ads=[];page="home";
  await auth.signOut();
  showLogin();
 }catch(e){
  console.error(e);
  showLogin(e.message||"Logout failed.");
 }
}

auth.onAuthStateChanged(async function(user){
 if(!user){showLogin();return;}
 try{
  const profile=await getUserProfile(user.uid);
  if(!profile){
   await auth.signOut();
   showLogin("Account profile not found.");
   return;
  }
  const status=String(profile.status||"").toLowerCase();
  if(profile.role!=="admin"&&status!=="approved"){
   await auth.signOut();
   showLogin("Your account is waiting for admin approval.");
   return;
  }
  me=profile;
  page="home";
  listenAds();
  render();
 }catch(e){
  console.error(e);
  showLogin(e.message||"Could not load account.");
 }
});
</script>

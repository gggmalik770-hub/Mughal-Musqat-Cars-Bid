function esc(s){

  "&":"&amp;",
  "<":"&lt;",
  ">":"&gt;",
  '"':"&quot;",
  "'":"&#39;"
 }[m]));
}

async function register(){

 const name=document.getElementById("rname").value.trim();
 const email=document.getElementById("remail").value.trim();
 const pass=document.getElementById("rpass").value;

 const err=document.getElementById("rerr");

 if(!name || !email || !pass){

  err.textContent="Please fill all fields.";

  return;
 }

 if(pass.length<6){

  err.textContent=
   "Password must be at least 6 characters.";

  return;
 }

 try{

  const cred=
   await auth.createUserWithEmailAndPassword(
    email,
    pass
   );

  await db.collection("users")
   .doc(cred.user.uid)
   .set({

    name:name,
    email:email,
    role:"user",
    status:"pending",

    createdAt:
     firebase.firestore.FieldValue.serverTimestamp()

   });

  await auth.signOut();

  showLogin(
   "Account created. Waiting for admin approval."
  );

 }catch(e){

  console.error(e);

  err.textContent=
   e.message || "Registration failed.";

 }

}

async function getUserProfile(uid){

 let snap=
  await db.collection("users").doc(uid).get();

 if(snap.exists){

  return {
   uid:uid,
   ...snap.data()
  };

 }

 snap=
  await db.collection("User").doc(uid).get();

 if(snap.exists){

  return {
   uid:uid,
   ...snap.data()
  };

 }

 return null;

}

async function login(){

 const email=
  document.getElementById("email").value.trim();

 const pass=
  document.getElementById("pass").value;

 const err=
  document.getElementById("err");

 err.textContent="";

 if(!email || !pass){

  err.textContent=
   "Enter email and password.";

  return;
 }

 try{

  const cred=
   await auth.signInWithEmailAndPassword(
    email,
    pass
   );

  const profile=
   await getUserProfile(
    cred.user.uid
   );

  if(!profile){

   await auth.signOut();

   err.textContent=
    "Account profile not found in Firestore.";

   return;
  }

  const status=
   String(profile.status||"").toLowerCase();

  if(
   profile.role!=="admin" &&
   status!=="approved"
  ){

   await auth.signOut();

   err.textContent=
    "Your account is waiting for admin approval.";

   return;
  }

  me=profile;

  page="home";

  listenAds();

  render();

 }catch(e){

  console.error(e);

  err.textContent=
   e.message || "Login failed.";

 }

}

function listenAds(){

 if(unsubscribeAds){

  unsubscribeAds();

 }

 unsubscribeAds=
  db.collection("ads")
   .where("status","==","active")
   .onSnapshot(

    snapshot=>{

     ads=[];

     snapshot.forEach(doc=>{

      ads.push({
       id:doc.id,
       ...doc.data()
      });

     });

     ads.sort(
      (a,b)=>
       (b.createdAt?.seconds||0)-
       (a.createdAt?.seconds||0)
     );

     if(me){

      render();

     }

    },

    error=>{

     console.error(
      "Ads listener:",
      error
     );

    }

   );

}

function compressImage(file){

 return new Promise(
  (resolve,reject)=>{

   const reader=
    new FileReader();

   reader.onload=e=>{

    const img=
     new Image();

    img.onload=()=>{

     const max=900;

     let w=img.width;
     let h=img.height;

     if(w>max || h>max){

      if(w>h){

       h=
        Math.round(
         h*max/w
        );

       w=max;

      }else{

       w=
        Math.round(
         w*max/h
        );

       h=max;

      }

     }

     const canvas=
      document.createElement(
       "canvas"
      );

     canvas.width=w;
     canvas.height=h;

     canvas
      .getContext("2d")
      .drawImage(
       img,
       0,
       0,
       w,
       h
      );

     resolve(
      canvas.toDataURL(
       "image/jpeg",
       0.55
      )
     );

    };

    img.onerror=reject;

    img.src=e.target.result;

   };

   reader.onerror=reject;

   reader.readAsDataURL(file);

  }
 );

}

async function addAd(){

 const title=
  document
   .getElementById("adTitle")
   .value
   .trim();

 const price=
  Number(
   document
    .getElementById("adPrice")
    .value || 0
  );

 const city=
  document
   .getElementById("adCity")
   .value
   .trim();

 const desc=
  document
   .getElementById("adDesc")
   .value
   .trim();

 const files=
  [
   ...document
    .getElementById("adImages")
    .files
  ].slice(0,4);

 const msg=
  document
   .getElementById("postMsg");

 if(!title || !price){

  msg.textContent=
   "Please enter car name and price.";

  return;

 }

 msg.textContent=
  "Uploading...";

 try{

  const images=[];

  for(
   const file of files
  ){

   images.push(
    await compressImage(file)
   );

  }

  await db
   .collection("ads")
   .add({

    title:title,
    price:price,
    city:city || "Muscat",
    desc:desc,
    images:images,

    ownerId:me.uid,

    ownerName:
     me.name || me.email,

    status:"active",

    createdAt:
     firebase.firestore.FieldValue
      .serverTimestamp()

   });

  msg.textContent=
   "Ad posted successfully.";

  document
   .getElementById("adTitle")
   .value="";

  document
   .getElementById("adPrice")
   .value="";

  document
   .getElementById("adCity")
   .value="";

  document
   .getElementById("adDesc")
   .value="";

  document
   .getElementById("adImages")
   .value="";

 }catch(e){

  console.error(e);

  msg.textContent=
   "Error: " + e.message;

 }

}

 if(unsubscribeAds){

  unsubscribeAds();

  unsubscribeAds=null;

 }

 me=null;

 await auth.signOut();

 showLogin();

}

auth.onAuthStateChanged(
 user=>{

  if(!user){

   me=null;

   showLogin();

  }

 }
);

showLogin();

</script>

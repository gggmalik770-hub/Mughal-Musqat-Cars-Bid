function esc(s){  
 return String(s==null?"":s).replace(/[&<>"']/g,m=>({  
  "&":"&amp;",  
  "<":"&lt;",  
  ">":"&gt;",  
  '"':"&quot;",  
  "'":"&#39;"  
 }[m]));  
}

async function register(){  
  
 const name=document.getElementById("rname").value.trim();  
 const email=document.getElementById("remail").value.trim();  
 const pass=document.getElementById("rpass").value;  
  
 const err=document.getElementById("rerr");  
  
 if(!name || !email || !pass){  
  
  err.textContent="Please fill all fields.";  
  
  return;  
 }  
  
 if(pass.length<6){  
  
  err.textContent=  
   "Password must be at least 6 characters.";  
  
  return;  
 }  
  
 try{  
  
  const cred=  
   await auth.createUserWithEmailAndPassword(  
    email,  
    pass  
   );  
  
  await db.collection("users")  
   .doc(cred.user.uid)  
   .set({  
  
    name:name,  
    email:email,  
    role:"user",  
    status:"pending",  
  
    createdAt:  
     firebase.firestore.FieldValue.serverTimestamp()  
  
   });  
  
  await auth.signOut();  
  
  showLogin(  
   "Account created. Waiting for admin approval."  
  );  
  
 }catch(e){  
  
  console.error(e);  
  
  err.textContent=  
   e.message || "Registration failed.";  
  
 }  
  
}  
  
async function getUserProfile(uid){  
  
 let snap=  
  await db.collection("users").doc(uid).get();  
  
 if(snap.exists){  
  
  return {  
   uid:uid,  
   ...snap.data()  
  };  
  
 }  
  
 snap=  
  await db.collection("User").doc(uid).get();  
  
 if(snap.exists){  
  
  return {  
   uid:uid,  
   ...snap.data()  
  };  
  
 }  
  
 return null;  
  
}  
  
async function login(){  
  
 const email=  
  document.getElementById("email").value.trim();  
  
 const pass=  
  document.getElementById("pass").value;  
  
 const err=  
  document.getElementById("err");  
  
 err.textContent="";  
  
 if(!email || !pass){  
  
  err.textContent=  
   "Enter email and password.";  
  
  return;  
 }  
  
 try{  
  
  const cred=  
   await auth.signInWithEmailAndPassword(  
    email,  
    pass  
   );  
  
  const profile=  
   await getUserProfile(  
    cred.user.uid  
   );  
  
  if(!profile){  
  
   await auth.signOut();  
  
   err.textContent=  
    "Account profile not found in Firestore.";  
  
   return;  
  }  
  
  const status=  
   String(profile.status||"").toLowerCase();  
  
  if(  
   profile.role!=="admin" &&  
   status!=="approved"  
  ){  
  
   await auth.signOut();  
  
   err.textContent=  
    "Your account is waiting for admin approval.";  
  
   return;  
  }  
  
  me=profile;  
  
  page="home";  
  
  listenAds();  
  
  render();  
  
 }catch(e){  
  
  console.error(e);  
  
  err.textContent=  
   e.message || "Login failed.";  
  
 }  
  
}  
  
function listenAds(){  
  
 if(unsubscribeAds){  
  
  unsubscribeAds();  
  
 }  
  
 unsubscribeAds=  
  db.collection("ads")  
   .where("status","==","active")  
   .onSnapshot(  
  
    snapshot=>{  
  
     ads=[];  
  
     snapshot.forEach(doc=>{  
  
      ads.push({  
       id:doc.id,  
       ...doc.data()  
      });  
  
     });  
  
     ads.sort(  
      (a,b)=>  
       (b.createdAt?.seconds||0)-  
       (a.createdAt?.seconds||0)  
     );  
  
     if(me){  
  
      render();  
  
     }  
  
    },  
  
    error=>{  
  
     console.error(  
      "Ads listener:",  
      error  
     );  
  
    }  
  
   );  
  
}

let selectedImages=[];

function previewImages(event){

selectedImages=[];

const files=[...event.target.files];

const preview=document.getElementById("preview");

if(!preview)return;

preview.innerHTML="";

files.slice(0,8).forEach(file=>{

const reader=new FileReader();

reader.onload=e=>{

selectedImages.push(e.target.result);

const img=document.createElement("img");

img.src=e.target.result;

preview.appendChild(img);

};

reader.readAsDataURL(file);

});

}

async function createAd(){

const title=
document.getElementById("adTitle").value.trim();

const price=
Number(document.getElementById("adPrice").value);

const city=
document.getElementById("adCity").value.trim();

const desc=
document.getElementById("adDesc").value.trim();

const err=
document.getElementById("postErr");

err.textContent="";

if(!title || !price || !city){

err.textContent=
"Please enter car title, price and city.";

return;

}

if(!me){

err.textContent=
"Please login first.";

return;

}

if(
me.role!=="admin" &&
String(me.status).toLowerCase()!=="approved"
){

err.textContent=
"Your account is not approved yet.";

return;

}

try{

await db.collection("ads").add({

title:title,

price:price,

city:city,

description:desc,

images:selectedImages,

ownerId:me.uid,

ownerName:me.name||me.email,

status:"active",

createdAt:
firebase.firestore.FieldValue.serverTimestamp()

});

selectedImages=[];

alert("Ad posted successfully.");

go("cars");

}catch(e){

console.error(e);

err.textContent=
e.message||"Could not post ad.";

}

}

async function placeBid(adId){

if(!me){

alert("Please login first.");

return;

}

const amount=prompt("Enter your bid amount in OMR:");

if(!amount)return;

const bid=Number(amount);

if(!bid || bid<=0){

alert("Enter a valid amount.");

return;

}

try{

await db.collection("ads")
.doc(adId)
.collection("bids")
.add({

userId:me.uid,

userName:me.name||me.email,

amount:bid,

createdAt:
firebase.firestore.FieldValue.serverTimestamp()

});

alert("Bid placed successfully.");

}catch(e){

console.error(e);

alert(e.message||"Bid failed.");

}

}

</span>

${esc(u.role||"user")}
</span>

<br><br>

${
u.role!=="admin" &&
String(u.status).toLowerCase()!=="approved"

?`

<button
class="btn"
onclick="approveUser('${esc(u.uid)}')">

Approve

</button>

`

:""

}

${
u.role!=="admin" &&
String(u.status).toLowerCase()==="approved"

?`

<button
class="btn red"
onclick="blockUser('${esc(u.uid)}')">

Block

</button>

`

:""

}

</div>

`;

});

box.innerHTML=
html||
'<p class="muted">No users found.</p>';

}catch(e){

console.error(e);

box.innerHTML=`

<p class="danger">

${esc(e.message||"Could not load users.")}

</p>

`;

}

}

async function approveUser(uid){

if(me.role!=="admin")return;

try{

await db.collection("users")
.doc(uid)
.update({

status:"approved"

});

alert("User approved.");

loadUsers();

}catch(e){

console.error(e);

alert(e.message||"Approval failed.");

}

}

async function blockUser(uid){

if(me.role!=="admin")return;

if(!confirm("Block this user?"))return;

try{

await db.collection("users")
.doc(uid)
.update({

status:"blocked"

});

alert("User blocked.");

loadUsers();

}catch(e){

console.error(e);

alert(e.message||"Could not block user.");

}

}

async function logout(){

try{

if(unsubscribeAds){

unsubscribeAds();

unsubscribeAds=null;

}

me=null;

ads=[];

page="home";

await auth.signOut();

showLogin();

}catch(e){

console.error(e);

showLogin(
e.message||"Logout failed."
);

}

}

auth.onAuthStateChanged(
async function(user){

if(!user){

showLogin();

return;

}

try{

const profile=
await getUserProfile(user.uid);

if(!profile){

await auth.signOut();

showLogin(
"Account profile not found."
);

return;

}

const status=
String(profile.status||"").toLowerCase();

if(
profile.role!=="admin" &&
status!=="approved"
){

await auth.signOut();

showLogin(
"Your account is waiting for admin approval."
);

return;

}

me=profile;

page="home";

listenAds();

render();

}catch(e){

console.error(e);

showLogin(
e.message||"Could not load account."
);

}

});
</script>

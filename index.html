function esc(s){
 return String(s||"").replace(/[&<>"']/g,m=>({
 "&":"&amp;",
 "<":"&lt;",
 ">":"&gt;",
 '"':"&quot;",
 "'":"&#39;"
 }[m]));
}

   </button>

  </div>
 </div>`;

async function register(){

 const name=document.getElementById("rname").value.trim();
 const email=document.getElementById("remail").value.trim();
 const pass=document.getElementById("rpass").value;

 if(!name || !email || !pass){
  document.getElementById("rerr").textContent=
   "Please fill all fields.";
  return;
 }

 if(pass.length<6){
  document.getElementById("rerr").textContent=
   "Password must be at least 6 characters.";
  return;
 }

 try{

  const cred=await auth.createUserWithEmailAndPassword(
   email,
   pass
  );

  await db.collection("users")
   .doc(cred.user.uid)
   .set({
    name:name,
    email:email,
    role:"user",
    status:"pending",
    createdAt:firebase.firestore.FieldValue.serverTimestamp()
   });

  await auth.signOut();

  showLogin(
   "Account created. Waiting for admin approval."
  );

 }catch(e){

  document.getElementById("rerr").textContent=e.message;

 }
}

async function getUserProfile(uid){

 let snap=
  await db.collection("users").doc(uid).get();

 if(snap.exists){
  return {
   uid:uid,
   ...snap.data()
  };
 }

 snap=
  await db.collection("User").doc(uid).get();

 if(snap.exists){
  return {
   uid:uid,
   ...snap.data()
  };
 }

 return null;
}

async function login(){

 const email=document.getElementById("email").value.trim();
 const pass=document.getElementById("pass").value;
 const err=document.getElementById("err");

 err.textContent="";

 if(!email || !pass){
  err.textContent="Enter email and password.";
  return;
 }

 try{

  const cred=
   await auth.signInWithEmailAndPassword(
    email,
    pass
   );

  const profile=
   await getUserProfile(cred.user.uid);

  if(!profile){

   await auth.signOut();

   err.textContent=
    "Account profile not found in Firestore.";

   return;
  }

  const status=
   String(profile.status||"").toLowerCase();

  if(profile.role!=="admin" && status!=="approved"){

   await auth.signOut();

   err.textContent=
    "Your account is waiting for admin approval.";

   return;
  }

  me=profile;

  page="home";

  loadAds();

  render();

 }catch(e){

  console.error(e);

  err.textContent=
   "Invalid email or password.";

 }
}

function loadAds(){

 if(unsubscribeAds){
  unsubscribeAds();
  unsubscribeAds=null;
 }

 unsubscribeAds=
  db.collection("ads")
   .where("status","==","active")
   .onSnapshot(snapshot=>{

    ads=[];

    snapshot.forEach(doc=>{
     ads.push({
      id:doc.id,
      ...doc.data()
     });
    });

    ads.sort((a,b)=>{
     const at=
      a.createdAt?.seconds || 0;
     const bt=
      b.createdAt?.seconds || 0;

     return bt-at;
    });

    if(me){
     render();
    }

   },error=>{

    console.error(error);

   });
}

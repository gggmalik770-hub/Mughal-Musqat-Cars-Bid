function esc(s){
 return String(s==null?"":s).replace(/[&<>"']/g,m=>({
  "&":"&amp;",
  "<":"&lt;",
  ">":"&gt;",
  '"':"&quot;",
  "'":"&#39;"
 }[m]));
}

 </div>`;

async function register(){
 const name=document.getElementById("rname").value.trim();
 const email=document.getElementById("remail").value.trim();
 const pass=document.getElementById("rpass").value;
 const err=document.getElementById("rerr");

 if(!name || !email || !pass){err.textContent="Please fill all fields.";return;}
 if(pass.length<6){err.textContent="Password must be at least 6 characters.";return;}

 try{
  const cred=await auth.createUserWithEmailAndPassword(email,pass);
  await db.collection("users").doc(cred.user.uid).set({
   name:name,email:email,role:"user",status:"pending",
   createdAt:firebase.firestore.FieldValue.serverTimestamp()
  });
  await auth.signOut();
  showLogin("Account created. Waiting for admin approval.");
 }catch(e){
  console.error(e);
  err.textContent=e.message||"Registration failed.";
 }
}

function normalizeOmanPhone(){
 let code=(document.getElementById("phoneCode")?.value||"+968").replace(/\s+/g,"");
 let n=(document.getElementById("phoneNumber")?.value||"").replace(/[^0-9]/g,"");
 if(n.startsWith("968")) n=n.slice(3);
 if(n.startsWith("0")) n=n.slice(1);
 if(code!=="+968") code="+968";
 if(!/^[0-9]{8}$/.test(n)) return null;
 return code+n;
}

function setupPhoneRecaptcha(){
 if(phoneRecaptcha) return phoneRecaptcha;
 phoneRecaptcha=new firebase.auth.RecaptchaVerifier("recaptcha-container",{size:"normal"});
 return phoneRecaptcha;
}

async function sendPhoneCode(){
 const err=document.getElementById("err");
 err.textContent="";
 const phone=normalizeOmanPhone();
 if(!phone){err.textContent="Enter an 8-digit Oman mobile number, e.g. 77009264.";return;}
 try{
  const verifier=setupPhoneRecaptcha();
  phoneConfirmation=await auth.signInWithPhoneNumber(phone,verifier);
  document.getElementById("otpBox").style.display="block";
  err.textContent="OTP sent by SMS.";
 }catch(e){
  console.error(e);
  if(phoneRecaptcha){try{phoneRecaptcha.clear();}catch(_){} phoneRecaptcha=null;}
  err.textContent=e.message||"Could not send OTP.";
 }
}

async function verifyPhoneCode(){
 const err=document.getElementById("err");
 const otp=(document.getElementById("phoneOtp")?.value||"").trim();
 if(!phoneConfirmation){err.textContent="Please request an OTP first.";return;}
 if(!/^\d{6}$/.test(otp)){err.textContent="Enter the 6-digit OTP.";return;}
 try{
  const cred=await phoneConfirmation.confirm(otp);
  const existing=await getUserProfile(cred.user.uid);
  if(!existing){
   await db.collection("users").doc(cred.user.uid).set({phone:cred.user.phoneNumber,name:"",role:"user",status:"pending",createdAt:firebase.firestore.FieldValue.serverTimestamp()});
   await auth.signOut();
   showLogin("Mobile verified. Your account is waiting for admin approval.");
   return;
  }
  const status=String(existing.status||"").toLowerCase();
  if(existing.role!=="admin"&&status!=="approved"){
   await auth.signOut();
   showLogin("Your account is waiting for admin approval.");
   return;
  }
  me=existing;
  page="home";
  listenAds();
  render();
 }catch(e){
  console.error(e);
  err.textContent=e.message||"Invalid OTP.";
 }
}

async function getUserProfile(uid){
 let snap=await db.collection("users").doc(uid).get();
 if(snap.exists){return {uid:uid,...snap.data()};}
 snap=await db.collection("User").doc(uid).get();
 if(snap.exists){return {uid:uid,...snap.data()};}
 return null;
}

async function login(){
 const email=document.getElementById("email").value.trim();
 const pass=document.getElementById("pass").value;
 const err=document.getElementById("err");
 err.textContent="";

 if(!email || !pass){err.textContent="Enter email and password.";return;}

 try{
  const cred=await auth.signInWithEmailAndPassword(email,pass);
  const profile=await getUserProfile(cred.user.uid);

  if(!profile){
   await auth.signOut();
   err.textContent="Account profile not found in Firestore.";
   return;
  }

  const status=String(profile.status||"").toLowerCase();

  if(profile.role!=="admin" && status!=="approved"){
   await auth.signOut();
   err.textContent="Your account is waiting for admin approval.";
   return;
  }

  me=profile;
  page="home";
  listenAds();
  render();
 }catch(e){
  console.error(e);
  err.textContent=e.message||"Login failed.";
 }
}

function listenAds(){
 if(unsubscribeAds){unsubscribeAds();}
 unsubscribeAds=db.collection("ads").onSnapshot(
  snapshot=>{
   ads=[];
   snapshot.forEach(doc=>{
    const a={id:doc.id,...doc.data()};
    if(String(a.status||"active").toLowerCase()==="active") ads.push(a);
   });
   ads.sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0));
   if(me){render();}
  },
  error=>{
   console.error("Ads listener:",error);
   const c=document.getElementById("content");
   if(c && me) c.innerHTML=home()+`<section><p class="danger">Ads could not be refreshed. Please refresh the page.</p></section>`;
  }
 );
}

let selectedImages=[];

function imageToSmallDataUrl(file,maxSide=900,quality=.58){
 return new Promise((resolve,reject)=>{
  const reader=new FileReader();
  reader.onload=e=>{
   const img=new Image();
   img.onload=()=>{
    const scale=Math.min(1,maxSide/Math.max(img.width,img.height));
    const canvas=document.createElement("canvas");
    canvas.width=Math.max(1,Math.round(img.width*scale));
    canvas.height=Math.max(1,Math.round(img.height*scale));
    const ctx=canvas.getContext("2d");
    ctx.drawImage(img,0,0,canvas.width,canvas.height);
    resolve(canvas.toDataURL("image/jpeg",quality));
   };
   img.onerror=reject;
   img.src=e.target.result;
  };
  reader.onerror=reject;
  reader.readAsDataURL(file);
 });
}

async function previewImages(event){
 selectedImages=[];
 const files=[...event.target.files].slice(0,3);
 const preview=document.getElementById("preview");
 if(!preview)return;
 preview.innerHTML="";
 for(const file of files){
  try{
   const data=await imageToSmallDataUrl(file);
   selectedImages.push(data);
   const img=document.createElement("img");
   img.src=data;
   preview.appendChild(img);
  }catch(e){console.error(e);}
 }
}

 }
}

async function blockUser(uid){
 if(me.role!=="admin")return;
 if(!confirm("Block this user?"))return;
 try{
  await db.collection("users").doc(uid).update({status:"blocked"});
  alert("User blocked.");
  loadUsers();
 }catch(e){console.error(e);alert(e.message||"Could not block user.");}
}

async function logout(){
 try{
  if(unsubscribeAds){unsubscribeAds();unsubscribeAds=null;}
  me=null;ads=[];page="home";
  await auth.signOut();
  showLogin();
 }catch(e){
  console.error(e);
  showLogin(e.message||"Logout failed.");
 }
}

auth.onAuthStateChanged(async function(user){
 if(!user){showLogin();return;}
 try{
  const profile=await getUserProfile(user.uid);
  if(!profile){
   await auth.signOut();
   showLogin("Account profile not found.");
   return;
  }
  const status=String(profile.status||"").toLowerCase();
  if(profile.role!=="admin"&&status!=="approved"){
   await auth.signOut();
   showLogin("Your account is waiting for admin approval.");
   return;
  }
  me=profile;
  page="home";
  listenAds();
  render();
 }catch(e){
  console.error(e);
  showLogin(e.message||"Could not load account.");
 }
});
</script>
</body>
